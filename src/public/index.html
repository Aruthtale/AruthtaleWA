<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-WA-BOT Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white p-8 font-sans min-h-screen">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 flex items-center">
            <span class="mr-3">📊</span> AI-WA-BOT Analytics
        </h1>
        
        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <div class="text-gray-400 text-sm mb-1 uppercase tracking-wider">Total Requests</div>
                <div class="text-3xl font-bold text-blue-400" id="total-req">0</div>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <div class="text-gray-400 text-sm mb-1 uppercase tracking-wider">Avg Latency</div>
                <div class="text-3xl font-bold text-yellow-400" id="avg-latency">0ms</div>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <div class="text-gray-400 text-sm mb-1 uppercase tracking-wider">Success Rate</div>
                <div class="text-3xl font-bold text-green-400" id="success-rate">0%</div>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <div class="text-gray-400 text-sm mb-1 uppercase tracking-wider">Primary Provider</div>
                <div class="text-2xl font-bold text-purple-400 truncate uppercase" id="top-provider">-</div>
            </div>
        </div>
        
        <!-- Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg flex flex-col items-center">
                <h3 class="text-lg font-semibold mb-4 text-gray-300 w-full">Provider Distribution</h3>
                <div class="w-full max-w-xs">
                    <canvas id="providerChart"></canvas>
                </div>
            </div>
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg flex flex-col items-center">
                <h3 class="text-lg font-semibold mb-4 text-gray-300 w-full">Tier Distribution</h3>
                <div class="w-full">
                    <canvas id="tierChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchMetrics() {
            try {
                const res = await fetch('/api/metrics');
                const data = await res.json();
                
                if (data.summary.total_requests === 0) {
                    document.getElementById('top-provider').innerText = 'No Data Yet';
                    return; // No data yet
                }

                // Update Cards
                document.getElementById('total-req').innerText = data.summary.total_requests;
                document.getElementById('avg-latency').innerText = data.summary.avg_latency + 'ms';
                document.getElementById('success-rate').innerText = data.summary.success_rate + '%';
                
                const providers = data.summary.providers;
                const topProvider = Object.keys(providers).sort((a,b) => providers[b] - providers[a])[0];
                document.getElementById('top-provider').innerText = topProvider ? topProvider : '-';
                
                // Set Global Chart Defaults
                Chart.defaults.color = '#9ca3af';
                Chart.defaults.font.family = 'Inter, ui-sans-serif, system-ui, sans-serif';

                // Provider Chart
                new Chart(document.getElementById('providerChart'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(providers).map(p => p.toUpperCase()),
                        datasets: [{
                            data: Object.values(providers),
                            backgroundColor: ['#3b82f6', '#10b981', '#8b5cf6', '#ef4444', '#f59e0b'],
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: { 
                        responsive: true,
                        plugins: { 
                            legend: { position: 'bottom' } 
                        } 
                    }
                });
                
                // Tier Chart
                const tiers = data.summary.tiers;
                new Chart(document.getElementById('tierChart'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(tiers).map(t => 'Tier ' + t),
                        datasets: [{
                            label: 'Requests per Tier',
                            data: Object.values(tiers),
                            backgroundColor: '#6366f1',
                            borderRadius: 6
                        }]
                    },
                    options: { 
                        responsive: true,
                        scales: { 
                            y: { beginAtZero: true, grid: { color: '#374151', drawBorder: false } },
                            x: { grid: { display: false, drawBorder: false } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
                
            } catch (error) {
                console.error('Failed to load metrics:', error);
                document.getElementById('top-provider').innerText = 'Error Loading';
            }
        }
        
        fetchMetrics();
    </script>
</body>
</html>
